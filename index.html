<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURAM | Capturador de Catálogo</title>
    <style>
        :root {
            --cyan-auram: #00d1ff;
            --dark-bg: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .active { display: flex; }

        .logo-auram { width: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--cyan-auram)); }
        
        .btn-auram {
            background: linear-gradient(135deg, #00d1ff, #0072ff);
            color: #fff; border: none; padding: 16px 30px;
            border-radius: 30px; font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 209, 255, 0.3);
            width: 100%; max-width: 280px;
        }

        .instruction-card {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 209, 255, 0.1);
            padding: 25px; border-radius: 20px;
            backdrop-filter: blur(10px); max-width: 320px;
        }

        video, #photo-preview, #ia-output-preview {
            width: 90%; max-width: 400px;
            border-radius: 15px;
            border: 1px solid rgba(0, 209, 255, 0.3);
            background: #000;
        }

        /* Pantalla de Carga */
        .loader {
            border: 3px solid rgba(0,209,255,0.1);
            border-top: 3px solid var(--cyan-auram);
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Fondo de cuadricula (transparencia) para verificar el PNG limpio */
        .preview-checkerboard {
            background: url('https://www.transparenttextures.com/patterns/checkerboard.png');
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 20px;
            border: 1px dashed var(--cyan-auram);
            width: 85%;
            max-width: 400px;
            margin: 20px 0;
        }

        .bottom-nav { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 15px; }
        
        .tag-info {
            font-size: 0.65rem;
            color: var(--cyan-auram);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE LOGIN -->
    <div id="screen-login" class="screen active" style="display: flex;">
        <img src="logo-auram.png" class="logo-auram" onerror="this.src='https://www.auram.site/logo-auram.png'">
        <h2 style="letter-spacing: 8px; font-weight: 200; margin-bottom: 30px;">AURAM APP</h2>
        <button class="btn-auram" onclick="irA('screen-instructions')">Entrar</button>
    </div>

    <!-- 2. PANTALLA DE INSTRUCCIONES -->
    <div id="screen-instructions" class="screen">
        <div class="instruction-card">
            <h3 style="color:var(--cyan-auram); letter-spacing: 2px; margin-bottom: 15px;">CAPTURA PROFESIONAL</h3>
            <ul style="text-align: left; font-size: 0.75rem; color: #ccc; line-height: 1.8; list-style: none; padding: 0;">
                <li style="margin-bottom: 8px;">🔹 Foto desde arriba (Vista Cenital).</li>
                <li style="margin-bottom: 8px;">🔹 Superficie o fondo liso uniforme.</li>
                <li style="margin-bottom: 8px;">🔹 Buena iluminación, evita sombras fuertes.</li>
                <li>🔹 Extiende la prenda para evitar arrugas.</li>
            </ul>
        </div>
        <div class="bottom-nav">
            <button class="btn-auram" onclick="irA('screen-camera')">Abrir Cámara</button>
        </div>
    </div>

    <!-- 3. PANTALLA DE LA CÁMARA -->
    <div id="screen-camera" class="screen" style="padding: 0;">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="bottom-nav">
            <button class="btn-auram" onclick="capturarFoto()">Capturar Prenda</button>
        </div>
    </div>

    <!-- 4. PANTALLA DE CONFIRMACIÓN -->
    <div id="screen-confirm" class="screen">
        <h3 style="color:var(--cyan-auram); font-size: 0.8rem; letter-spacing: 2px;">¿LA FOTO ES CORRECTA?</h3>
        <img id="photo-preview">
        <div class="bottom-nav">
            <button class="btn-auram" style="background:#333; width: 120px;" onclick="irA('screen-camera')">REPETIR</button>
            <button class="btn-auram" style="width: 120px;" onclick="procesarBorradorFondo()">SÍ, PROCESAR</button>
        </div>
    </div>

    <!-- 5. PANTALLA DE RESULTADO FINAL (PRENDA TRANSPARENTE PNG) -->
    <div id="screen-result" class="screen">
        <h3 style="color:var(--cyan-auram); font-size: 0.8rem; letter-spacing: 2px;">PRENDA DIGITALIZADA</h3>
        <div class="preview-checkerboard">
            <img id="ia-output-preview" style="width: 100%; display: block;">
        </div>
        <div id="garment-data" class="tag-info"></div>
        <div class="bottom-nav">
            <button class="btn-auram" style="background:#333; width: 120px;" onclick="irA('screen-camera')">NUEVA</button>
            <button class="btn-auram" style="width: 120px;" onclick="alert('Digitalización exitosa. Datos listos para guardado permanente en Firestore/Bucket.')">GUARDAR</button>
        </div>
    </div>

    <!-- PANTALLA DE CARGA (DOBLE PROCESO UNIFICADO) -->
    <div id="screen-loading" class="screen" style="background: rgba(0,0,0,0.95); z-index: 10000;">
        <div class="loader"></div>
        <!-- Corregido: Se agregaron las IDs exactas que busca el JavaScript para evitar errores de tipo Null -->
        <p id="loading-text" style="color: var(--cyan-auram); font-size: 0.75rem; letter-spacing: 3px; font-weight: bold; margin-top: 20px; text-transform: uppercase;">PROCESANDO PRENDA...</p>
        <p id="loading-subtext" style="color: #666; font-size: 0.65rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">PREPARANDO MOTOR IA...</p>
    </div>

    <script>
        // Declaración única de variables globales (Previene colisión de variables)
        let fotoOriginalBase64 = "";
        let stream = null;

        function irA(screenId) {
            console.log("Navegando a pantalla:", screenId);
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active');
                target.style.display = 'flex';
                
                if (screenId === 'screen-camera') {
                    encenderCamara();
                } else if (stream) {
                    // Detener la cámara para ahorrar recursos de batería si no estamos en pantalla de captura
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
            }
        }

        async function encenderCamara() {
            const video = document.getElementById('webcam');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (e) { 
                console.error("Error de cámara:", e);
                alert("Error de cámara. Asegúrate de estar usando el enlace seguro HTTPS de Vercel."); 
            }
        }

        function capturarFoto() {
            const v = document.getElementById('webcam');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; 
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            
            // Extraer la porción limpia base64 sin encabezados de datos URL
            fotoOriginalBase64 = c.toDataURL('image/jpeg', 0.8).split(',')[1];
            
            // Mostrar la vista previa en la pantalla de confirmación
            document.getElementById('photo-preview').src = "data:image/jpeg;base64," + fotoOriginalBase64;
            irA('screen-confirm');
        }

        // FUNCIÓN CLAVE: Ejecuta en paralelo el borrado y clasificación sin trabar la interfaz
        async function procesarBorradorFondo() {
            const loadingScreen = document.getElementById('screen-loading');
            const loadingText = document.getElementById('loading-text');
            const loadingSub = document.getElementById('loading-subtext');

            // Mostrar el overlay de carga de manera explícita
            if (loadingScreen) {
                loadingScreen.style.display = 'flex';
                loadingScreen.classList.add('active');
            }

            // Cambiar textos dinámicos del paso 1
            if (loadingText) loadingText.innerText = "PASO 1: EXTRACCIÓN DE PRENDA";
            if (loadingSub) loadingSub.innerText = "Identificando silueta y removiendo fondo...";

            try {
                // --- LLAMADA PASO 1 (api/borrar-fondo.js) ---
                const res1 = await fetch('/api/borrar-fondo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: fotoOriginalBase64 })
                });

                if (!res1.ok) throw new Error("Fallo en la comunicación del Paso 1 con el servidor.");
                const data1 = await res1.json();
                
                if (!data1.success || !data1.imagenSinFondo) {
                    throw new Error(data1.detalle || "La IA no logró aislar la prenda correctamente.");
                }

                // Cambiar textos dinámicos para el paso 2
                if (loadingText) loadingText.innerText = "PASO 2: ACABADO PROFESIONAL";
                if (loadingSub) loadingSub.innerText = "Limpiando transparencias y detectando metadatos...";

                // --- LLAMADA PASO 2 (api/generar-catalogo.js) ---
                const res2 = await fetch('/api/generar-catalogo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: data1.imagenSinFondo })
                });

                if (!res2.ok) throw new Error("Fallo en el refinamiento del Paso 2 con el servidor.");
                const data2 = await res2.json();

                if (data2.success && data2.finalImage) {
                    // Colocar el PNG final transparente en el preview
                    document.getElementById('ia-output-preview').src = "data:image/png;base64," + data2.finalImage;
                    
                    // Imprimir datos detectados de manera automática
                    document.getElementById('garment-data').innerText = `${data2.category} | ${data2.color} | ID SUGERIDO: ${data2.suggestedCode}`;
                    
                    // Ocultar pantalla de carga e ir al resultado
                    if (loadingScreen) {
                        loadingScreen.style.display = 'none';
                        loadingScreen.classList.remove('active');
                    }
                    irA('screen-result');
                } else {
                    throw new Error(data2.detalle || "Fallo en el procesamiento de acabado final.");
                }

            } catch (err) {
                // Ocultar pantalla de carga en caso de error para no bloquear la pantalla del usuario
                if (loadingScreen) {
                    loadingScreen.style.display = 'none';
                    loadingScreen.classList.remove('active');
                }
                alert("ERROR DE PROCESAMIENTO:\n" + err.message);
                irA('screen-confirm');
            }
        }
    </script>
</body>
</html>
