<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURAM | Capturador de Prendas</title>
    <style>
        :root {
            --cyan-auram: #00d1ff;
            --dark-bg: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .active { display: flex; opacity: 1; }

        /* Estética de Logo */
        .logo-container { margin-bottom: 30px; }
        .logo-auram { width: 100px; filter: drop-shadow(0 0 15px rgba(0, 209, 255, 0.4)); }
        .brand-name { 
            font-weight: 200; 
            letter-spacing: 10px; 
            font-size: 1.2rem; 
            color: #fff;
            margin-top: 10px;
        }

        input {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 209, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            text-align: center;
            font-size: 0.9rem;
            width: 100%;
            max-width: 300px;
            margin-bottom: 10px;
        }

        .btn-auram {
            background: linear-gradient(135deg, #00d1ff, #0072ff);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 209, 255, 0.3);
            font-size: 0.8rem;
            width: 100%;
            max-width: 300px;
        }

        .instruction-card {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 209, 255, 0.1);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            max-width: 340px;
        }

        .instruction-list {
            text-align: left;
            font-size: 0.75rem;
            color: #bbb;
            line-height: 1.8;
            margin-bottom: 30px;
            list-style: none;
            padding: 0;
        }

        .instruction-list li::before {
            content: "•";
            color: var(--cyan-auram);
            margin-right: 10px;
            font-weight: bold;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Pantalla de Carga */
        .loader {
            border: 3px solid rgba(0,209,255,0.1);
            border-top: 3px solid var(--cyan-auram);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Checkerboard para transparencia */
        .preview-bg {
            background: url('https://www.transparenttextures.com/patterns/checkerboard.png');
            background-color: #111;
            border-radius: 15px;
            border: 1px dashed var(--cyan-auram);
            width: 85%;
            margin: 20px 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .bottom-nav { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <!-- FASE 1: LOGIN -->
    <div id="screen-login" class="screen active" style="display: flex;">
        <div class="logo-container">
            <img src="logo-auram.png" class="logo-auram">
            <div class="brand-name">AURAM APP</div>
        </div>
        <div class="login-box" style="display:flex; flex-direction:column; gap:10px; width:100%; align-items:center;">
            <input type="text" placeholder="USUARIO" readonly value="ADMIN_TEST">
            <input type="password" placeholder="CONTRASEÑA" readonly value="••••••••">
            <button class="btn-auram" onclick="irA('screen-instructions')">Entrar</button>
        </div>
    </div>

    <!-- FASE 2: INSTRUCCIONES -->
    <div id="screen-instructions" class="screen">
        <div class="instruction-card">
            <h2 style="color:var(--cyan-auram); font-weight:300; letter-spacing:3px; font-size:1rem; margin-bottom:20px;">REGLAS DE CAPTURA</h2>
            <ul class="instruction-list">
                <li>Coloca la prenda en una superficie plana y sólida.</li>
                <li>Asegúrate de tener iluminación uniforme.</li>
                <li>La cámara debe estar paralela a la prenda.</li>
                <li>Evita arrugas en la tela.</li>
            </ul>
        </div>
        <div class="bottom-nav">
            <button class="btn-auram" style="width: 200px;" onclick="irA('screen-camera')">Abrir Cámara</button>
        </div>
    </div>

    <!-- FASE 3: CÁMARA -->
    <div id="screen-camera" class="screen" style="padding: 0;">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="bottom-nav">
            <button class="btn-auram" onclick="capturarPrenda()">Capturar Prenda</button>
        </div>
    </div>

    <!-- FASE 4: CONFIRMACIÓN -->
    <div id="screen-confirm" class="screen">
        <h3 style="color:var(--cyan-auram); font-size: 0.8rem; letter-spacing: 3px;">¿ES ESTA LA PRENDA?</h3>
        <img id="photo-preview" style="width: 80%; border-radius: 15px; border: 1px solid var(--cyan-auram); margin: 20px 0;">
        <div style="display: flex; gap: 15px; width: 85%;">
            <button class="btn-auram" style="flex:1; background: #333;" onclick="irA('screen-camera')">NO</button>
            <button class="btn-auram" style="flex:1;" onclick="procesarBorradorFondo()">SÍ</button>
        </div>
    </div>

    <!-- FASE 5: RESULTADO IA -->
    <div id="screen-result-ia" class="screen">
        <h3 style="color:var(--cyan-auram); font-size: 0.8rem; letter-spacing: 3px;">VISTA PREVIA (SIN FONDO)</h3>
        <div class="preview-bg">
            <img id="ia-output-preview" style="width: 100%; display: block;">
        </div>
        <div style="display: flex; gap: 15px; width: 85%;">
            <button class="btn-auram" style="flex:1; background: #333;" onclick="irA('screen-camera')">REPETIR</button>
            <button class="btn-auram" style="flex:1;" onclick="alert('Digitalización completa. Guardando en catálogo...')">ACEPTAR</button>
        </div>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="screen-loading" class="screen" style="background: rgba(0,0,0,0.95); z-index: 10000;">
        <div class="loader"></div>
        <div style="color:var(--cyan-auram); letter-spacing:3px; font-weight:bold; font-size:0.7rem;">ELIMINANDO FONDO...</div>
    </div>

    <script>
        let fotoBase64 = null;
        let streamActivo = null;

        function irA(screenId) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active');
                target.style.display = 'flex';
                if(screenId === 'screen-camera') iniciarCamara();
                else if (streamActivo && screenId !== 'screen-camera') {
                    streamActivo.getTracks().forEach(t => t.stop());
                    streamActivo = null;
                }
            }
        }

        async function iniciarCamara() {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1080 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                streamActivo = stream;
            } catch (err) {
                alert("Error de cámara: " + err.message);
            }
        }

        function capturarPrenda() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('photo-preview').src = fotoBase64;
            irA('screen-confirm');
        }

    // Variable para guardar el resultado del primer paso
let prendaLimpiaTemporal = null;

async function procesarBorradorFondo() {
    irA('screen-loading');
    document.querySelector('#screen-loading p').innerText = "BORRANDO FONDO...";
    
    try {
        const response = await fetch('/api/borrar-fondo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: fotoBase64 })
        });

        const data = await response.json();

        if (data.success && data.imagenSinFondo) {
            prendaLimpiaTemporal = data.imagenSinFondo; // Guardamos para el segundo paso
            document.getElementById('ia-output-preview').src = "data:image/png;base64," + data.imagenSinFondo;
            irA('screen-result-ia');
        } else {
            alert("Error: " + data.detalle);
            irA('screen-confirm');
        }
    } catch (err) {
        alert("Error de conexión etapa 1");
        irA('screen-confirm');
    }
}

// NUEVA FUNCIÓN: Segundo paso para acabado profesional y clasificación
async function finalizarDigitalizacion() {
    irA('screen-loading');
    document.querySelector('#screen-loading p').innerText = "GENERANDO ACABADO PROFESIONAL...";

    try {
        const response = await fetch('/api/generar-catalogo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: prendaLimpiaTemporal })
        });

        const data = await response.json();

        if (data.success) {
            // Aquí ya tenemos la prenda perfecta estilo B001.png
            document.getElementById('ia-output-preview').src = "data:image/png;base64," + data.finalImage;
            
            // Mostramos los datos detectados
            alert(`Prenda clasificada: ${data.category} - Color: ${data.color}\nCódigo asignado: ${data.suggestedCode}`);
            
            // Aquí ya podríamos mandarlo al Bucket definitivo
            irA('screen-result-ia'); 
            alert("¡Proceso de Catálogo completado con éxito!");
        }
    } catch (err) {
        alert("Error en el refinamiento final");
        irA('screen-result-ia');
    }
}
    </script>
</body>
</html>
